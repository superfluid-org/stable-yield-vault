[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.34"
optimizer = true
optimizer_runs = 200

[fmt]
bracket_spacing = true
sort_imports = true
contract_new_lines = true
line_length = 120
number_underscore = "thousands"
wrap_comments = true

[lint]
lint_on_build = false



# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
